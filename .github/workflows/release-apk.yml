name: Release APK

# Builds the Android release APK and publishes it as a GitHub Release, and
# deploys the web build to GitHub Pages.
# Runs only on pushes to main; other branches never build or deploy.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --build-name=${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Prepare release info
        id: info
        run: |
          # Versions are plain incrementing integers: the workflow run number.
          tag="${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "roll-the-dice-${tag}.apk"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "apk=roll-the-dice-${tag}.apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ steps.info.outputs.apk }}

  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Served from https://<owner>.github.io/<repo>/, so the base href is
      # the repo name. --no-web-resources-cdn keeps CanvasKit on our own
      # origin so the offline cache covers it.
      - name: Build web
        run: >-
          flutter build web --release --no-web-resources-cdn
          --base-href "/${{ github.event.repository.name }}/"
          --build-name=${{ github.run_number }} --build-number=${{ github.run_number }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
