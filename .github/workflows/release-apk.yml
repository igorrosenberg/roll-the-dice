name: Release APK

# Builds the Android release APK and publishes it as a GitHub Release.
# Runs only on pushes to main; other branches never build the APK.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Prepare release info
        id: info
        run: |
          version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          tag="v${version}-build${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "roll-the-dice-${tag}.apk"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "apk=roll-the-dice-${tag}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.info.outputs.apk }}
          path: ${{ steps.info.outputs.apk }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ steps.info.outputs.apk }}
