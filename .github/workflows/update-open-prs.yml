# Whenever main changes, merge the new main into every open PR that targets it.
# A PR that conflicts with main is not changed: the workflow comments on it instead
# (once per PR head commit), so whoever watches the PR, including a Claude session, is told.
# Any other error (permissions, rate limit, outage) is logged and fails the run, without commenting.
name: Update open PRs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-open-prs
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Merge main into each open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          prs=$(gh pr list --repo "$REPO" --base main --state open --limit 100 \
            --json number,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | .number')
          if [ -z "$prs" ]; then
            echo "No open PRs to update." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          failed=0
          for pr in $prs; do
            if out=$(gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" 2>&1); then
              echo "- #$pr: updated with latest main" >> "$GITHUB_STEP_SUMMARY"
            elif echo "$out" | grep -qi "no new commits"; then
              echo "- #$pr: already up to date" >> "$GITHUB_STEP_SUMMARY"
            elif echo "$out" | grep -qi "merge conflict"; then
              echo "::warning::PR #$pr conflicts with main"
              echo "- #$pr: NOT updated, conflicts with main" >> "$GITHUB_STEP_SUMMARY"
              head=$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid)
              marker="<!-- update-open-prs-conflict head=$head -->"
              if ! gh pr view "$pr" --repo "$REPO" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
                gh pr comment "$pr" --repo "$REPO" --body "$marker
          This PR conflicts with the latest \`main\` and could not be updated automatically. Please merge \`main\` into this branch and resolve the conflicts."
              fi
            else
              echo "::error::PR #$pr could not be updated: $out"
              echo "- #$pr: ERROR, see the run log" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          exit $failed
