<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tap anywhere to roll two six-sided dice.">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dice">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Roll the Dice</title>
  <meta name="theme-color" content="#2E7D32">
  <link rel="manifest" href="manifest.json">

  <!--
    Splash screen: shown straight away, while the app engine downloads,
    and faded out when Flutter draws its first frame.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #2E7D32; }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      background: #2E7D32; transition: opacity 0.3s ease-out;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash .die {
      width: 72px; height: 72px; padding: 10px; box-sizing: border-box;
      background: #fff; border-radius: 16px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      animation: splash-roll 1.2s ease-in-out infinite;
    }
    #splash .pip {
      width: 12px; height: 12px; margin: auto;
      border-radius: 50%; background: #212121;
    }
    #splash .pip:nth-child(2) { grid-area: 1 / 3; }
    #splash .pip:nth-child(3) { grid-area: 2 / 2; }
    #splash .pip:nth-child(4) { grid-area: 3 / 1; }
    #splash .pip:nth-child(5) { grid-area: 3 / 3; }
    @keyframes splash-roll {
      0%, 100% { transform: rotate(-12deg); }
      50% { transform: rotate(12deg) scale(1.06); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .die { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading">
    <div class="die"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      const splash = document.getElementById('splash');
      splash.classList.add('done');
      setTimeout(() => splash.remove(), 400);
    }, { once: true });
  </script>

  <!--
    The bootstrap script is inlined at build time (see web/flutter_bootstrap.js),
    which saves a round trip before the engine starts downloading.
  -->
  <script>
    {{flutter_bootstrap_js}}
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      // Registered straight away, so its install overlaps with the app loading.
      navigator.serviceWorker.register('sw.js');
      // After the first frame, hand the service worker the files this page
      // loaded, so a first visit already works offline next time.
      window.addEventListener('flutter-first-frame', async () => {
        const registration = await navigator.serviceWorker.ready;
        const urls = performance.getEntriesByType('resource')
          .map((entry) => entry.name)
          .filter((url) => url.startsWith(location.origin));
        registration.active?.postMessage({ type: 'cache', urls: [location.href, ...urls] });
      }, { once: true });
    }
  </script>
</body>
</html>
